name: Get jac kit
description: >
  Download the sealed kit built from this checkout (binary, typeshed stubs,
  vendored musl/wasm runtimes land at their in-tree paths), put jac on PATH,
  pin JAC_NO_DEV_SOURCE=1 so the shipped compiler is what runs (a step that
  needs the [dev] reroute clears it explicitly), and warm the runtime cache.
  upload-artifact strips the executable bit; restore it.
inputs:
  name:
    description: Kit artifact name
    required: false
    default: jac-kit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: jac

    - shell: bash
      run: |
        chmod +x "$GITHUB_WORKSPACE/jac/zig-out/bin/jac"
        echo "$GITHUB_WORKSPACE/jac/zig-out/bin" >> "$GITHUB_PATH"
        echo "JAC_NO_DEV_SOURCE=1" >> "$GITHUB_ENV"

    # First use unpacks the payload (seconds). Pay it once here, serially.
    # `jac --version` is not enough: it touches a tenth of the modules a
    # real compile does.
    - name: Warm the runtime cache
      shell: bash
      run: |
        set -euo pipefail
        WORK="$(mktemp -d)"
        printf 'with entry { print(6*7); }\n' > "$WORK/warm.jac"
        out="$(jac run "$WORK/warm.jac" 2>&1)" || { echo "$out"; exit 1; }
        echo "$out" | tail -3
        echo "$out" | grep -q 42
