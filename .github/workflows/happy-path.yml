name: happy-path

# Validates the documented quickstart end to end, exactly as a fresh user runs
# it: curl-install the self-contained jac binary, clone this repo, cd into the
# in-tree jaclang.org site (jac/examples/jaclang_org), jac install, jac run,
# then drive the served site headlessly through the full
# scripts/site-browse-journey.sh journey (landing, wait-wuuut, leaderboard,
# the whole socialize flow, docs, 404, console sweep).
#
# No repo checkout on purpose: the run must succeed on a bare machine using
# only the published install script, the released binary it fetches, and a
# plain git clone -- the same three moves the site's finale tells visitors to
# make.
#
# No pull_request trigger, also on purpose: this lane exercises the RELEASED
# binary against MAIN's tree, neither of which a PR can change, so a PR run
# can only ever validate yesterday's world (and goes red whenever the
# quickstart's target has not shipped yet). PR-time coverage of the same
# journey lives in ci.yml's pack-smoke job, which runs the PR's own tree on
# the PR's own sealed kit. Expect this lane red between merging a
# quickstart-affecting change and the release that ships it.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/site-browse-journey.sh"
      - ".github/workflows/happy-path.yml"

permissions:
  contents: read

concurrency:
  group: happy-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install jac (documented curl one-liner)
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: jac is on PATH and runs
        run: jac --version

      - name: Clone the repo (as the site's quickstart documents)
        run: git clone --depth 1 https://github.com/jaseci-labs/jac

      - name: jac install (first run pulls npm deps)
        working-directory: jac/jac/examples/jaclang_org
        run: jac install

      # JAC_NO_DEV_SOURCE: the site's jac.toml carries a [dev] live-source
      # stanza for contributors; a fresh user's released binary must serve it
      # without that reroute. The docs section reads the corpus bundled with
      # that binary, so the docs stop needs nothing beyond the install.
      - name: jac run in the background (the documented dev server)
        working-directory: jac/jac/examples/jaclang_org
        env:
          JAC_NO_DEV_SOURCE: "1"
        run: |
          nohup jac run > "$RUNNER_TEMP/jac-run.log" 2>&1 &
          echo "jac run launched (pid $!)"

      - name: Wait for http://localhost:8000
        run: |
          for i in $(seq 1 1200); do
            if curl -fsS -o /dev/null http://localhost:8000/; then
              echo "server answered after ~${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not answer on :8000 within 20 minutes"
          tail -n 200 "$RUNNER_TEMP/jac-run.log"
          exit 1

      # SITE_JOURNEY_SKIP_WASM: dev-mode native wasm emission needs a jac
      # release that carries the dev-emit fix; drop the knob once that ships.
      - name: Drive the site through the full browse journey
        timeout-minutes: 20
        env:
          SITE_JOURNEY_SKIP_WASM: "1"
          SITE_JOURNEY_ARTIFACTS: ${{ runner.temp }}
        run: bash jac/scripts/site-browse-journey.sh http://localhost:8000

      - name: "browse: parting screenshot"
        run: jac browse screenshot "$RUNNER_TEMP/happy-path.png"

      - name: "browse: close"
        if: always()
        run: jac browse close || true

      - name: Upload screenshots + server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-path
          path: |
            ${{ runner.temp }}/happy-path.png
            ${{ runner.temp }}/site-journey-failure.png
            ${{ runner.temp }}/jac-run.log
          if-no-files-found: ignore
