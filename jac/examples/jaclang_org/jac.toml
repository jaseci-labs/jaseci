[project]
name = "jaclang_org"
entry-point = "main.jac"
kind = "web-app"
jac-version = "0.35.0"

# Makes this site scaffoldable as a template: `jac create <name> --awesome`
# dumps it (the payload bundles this tree as awesome_template beside the
# jaclang package). The section never reaches a scaffolded project's jac.toml.
[jacpack]
name = "awesome"
description = "The full jaclang.org site: landing, live docs, leaderboard, socialize, and a wasm game in one Jac program"

[dev]
jaclang_source = "../.."

[precommit]
typecheck = true

[test]
directories = ["socialize", "leaderboard", "shared", "docs"]

[check.lint]
select = ["all", "strip-comments", "strip-docstrings"]
exclude = [
    ".jac/*",
    "examples/*",
    "source/FloatingSource.jac",
    "landing/Reveal.jac",
    "game/webgl_host.jac",
    "shared/async_utils.jac",
    "leaderboard/format.jac",
]

[gc]
default = "none"

[gc.enforce]
modules = ["arena*", "sim*", "gmath*", "platform_rl*"]

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
[dependencies.npm]
embla-carousel-react = "*"
"@hugeicons/core-free-icons" = "*"
"@hugeicons/react" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/geist-mono" = "latest"
motion = "latest"
mermaid = "^11"
lucide-react = "^0.469.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"

# Keeps local `jac run` single-process (vite dev + HMR) while the routes table
# below still declares the deployed service cut. The deprecation warning says
# to delete this, but without it `jac run` enters local microservice mode,
# which serves no web app (see _planning/site_qa_jac_issues.md).
[scale.microservices]
enabled = false

[client.assets]
custom_extensions = [
    ".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico",
    ".woff", ".woff2", ".ttf", ".otf", ".eot", ".mp4", ".webm", ".mp3",
    ".wav", ".css", ".js", ".json",
]

[client.app_meta_data]
title = "The Jac Programming Language"
description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
keywords = "jac, jaclang, programming language, jaseci, object-spatial programming, by llm, full-stack"
author = "Jaseci Labs"
theme_color = "#ff6b35"
icon = "/static/assets/jac-logo.png"
og_title = "The Jac Programming Language"
og_description = "One language, one compiler, the whole stack. No glue. AI, graphs, persistence, APIs, UIs, and cloud deployment as language features."
og_type = "website"
og_url = "https://jaclang.org/"
og_site_name = "jaclang.org"
og_image = "https://jaclang.org/static/assets/jac-logo.png"
twitter_card = "summary"
twitter_image = "https://jaclang.org/static/assets/jac-logo.png"

# The service cut: scoring runs as its own process, routed by the gateway,
# and the socialize section's social graph is its own service the same way.
[scale.microservices.routes]
"scoring_service" = "/scoring_service"
"social_graph" = "/social_graph"

[scale.microservices.services.social_graph]
file = "socialize/social_graph.jac"
