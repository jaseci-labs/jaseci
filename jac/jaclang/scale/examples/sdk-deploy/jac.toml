[project]
name = "sdk-greeter"
version = "0.1.0"
description = "Minimal microservice app deployed programmatically via the jac-scale SDK"
entry-point = "main.jac"

# Runtime routing for the in-cluster gateway. The deploy side does NOT read
# this file: deploy.jac declares the same route on its DeploySpec.
[scale.microservices.routes]
greeter = "/greeter"

# Headless API app: without this the gateway would try to build a web client
# bundle for the entry point (the default when client.entry is unset).
[scale.microservices.client]
entry = false
